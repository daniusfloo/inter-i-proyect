<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S.E.A: Panel Principal</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 text-slate-900 antialiased">
    <main class="mx-auto min-h-screen w-[min(1040px,calc(100%-32px))] py-8">
      <section
        class="rounded-lg bg-[linear-gradient(90deg,rgba(15,37,54,.94),rgba(18,86,112,.82)),url('https://images.unsplash.com/photo-1587745416684-47953f16f02f?auto=format&fit=crop&w=1600&q=80')] bg-cover bg-center p-7 text-white"
      >
        <p class="mb-2 text-xs font-bold uppercase text-teal-200">
          Panel de acceso
        </p>
        <h1 class="mb-2 text-3xl font-bold leading-tight md:text-5xl">
          S.E.A: Servicio de Emergencia en Ambulancia
        </h1>
        <p class="max-w-2xl text-slate-100">
          Panel simple para consultar opciones generales del sistema.
        </p>
      </section>

      <section class="my-6 grid gap-4 md:grid-cols-5">
        <button class="menu-tab" data-section="configuraciones">Configuraciones</button>
        <button class="menu-tab" data-section="ayuda">Ayuda</button>
        <button class="menu-tab" data-section="registro">Registro</button>
        <button class="menu-tab" data-section="informacion">Informacion</button>
        <button class="menu-tab" data-section="numeros">Numeros de emergencia</button>
      </section>

      <section>
        <section id="contentPanel" class="rounded-lg border border-slate-200 bg-white p-6"></section>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
