<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruta vida CR: Configuracion de Alertas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background:
          radial-gradient(circle at 12% 8%, rgba(34, 211, 238, 0.18), transparent 24rem),
          radial-gradient(circle at 88% 12%, rgba(226, 29, 45, 0.18), transparent 24rem),
          linear-gradient(135deg, #050b18 0%, #071836 48%, #0f172a 100%) !important;
        color: #e5edf8;
      }

      section, article {
        backdrop-filter: blur(18px);
      }

      .bg-white, .bg-slate-50 {
        background-color: rgba(255, 255, 255, 0.9) !important;
      }

      .border-slate-200 {
        border-color: rgba(148, 163, 184, 0.36) !important;
      }

      main > section:first-child {
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 30px 90px rgba(7, 24, 54, 0.5);
      }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-900 antialiased">
    <main class="mx-auto min-h-screen w-[min(900px,calc(100%-32px))] py-8">
      <section
        class="rounded-lg bg-[linear-gradient(90deg,rgba(15,37,54,.94),rgba(18,86,112,.82)),url('https://images.unsplash.com/photo-1587745416684-47953f16f02f?auto=format&fit=crop&w=1600&q=80')] bg-cover bg-center p-7 text-white"
      >
        <p class="mb-2 text-xs font-bold uppercase text-teal-200">
          Configuracion
        </p>
        <h1 class="mb-2 text-3xl font-bold leading-tight md:text-5xl">
          Ruta vida CR: Configuracion de alertas
        </h1>
        <p class="max-w-2xl text-slate-100">
          Seleccion de tipos de alertas para el sistema.
        </p>
      </section>

      <a
        id="menuLink"
        class="mt-4 inline-flex min-h-11 items-center rounded-md bg-white px-4 font-bold text-slate-800 ring-1 ring-slate-200 transition hover:bg-slate-50"
      >
        Volver al panel principal
      </a>

      <section class="mt-6 rounded-lg border border-slate-200 bg-white p-6">
        <p class="text-sm font-bold uppercase text-teal-700">Alertas</p>
        <h2 class="mt-1 text-2xl font-bold text-slate-900">Tipos de alertas</h2>

        <div class="mt-6 grid gap-3">
          <article class="rounded-lg border border-slate-200 bg-slate-50 p-4">
            <p class="font-bold text-slate-900">alerta ruidosa</p>
          </article>
          <article class="rounded-lg border border-slate-200 bg-slate-50 p-4">
            <p class="font-bold text-slate-900">alerta original</p>
          </article>
          <article class="rounded-lg border border-slate-200 bg-slate-50 p-4">
            <p class="font-bold text-slate-900">alerta personalizada</p>
          </article>
        </div>
      </section>
    </main>

    <script src="browser.js"></script>
  </body>
</html>
