<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S.E.A: Servicio de Emergencia en Ambulancia</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 text-slate-900 antialiased">
    <main class="mx-auto w-[min(1120px,calc(100%-32px))] py-9">
      <section
        class="flex flex-col justify-between gap-6 rounded-lg bg-[linear-gradient(90deg,rgba(15,37,54,.94),rgba(18,86,112,.82)),url('https://images.unsplash.com/photo-1587745416684-47953f16f02f?auto=format&fit=crop&w=1600&q=80')] bg-cover bg-center p-7 text-white md:flex-row md:items-center"
      >
        <div>
          <p class="mb-2 text-xs font-bold uppercase text-teal-200">
            Centro de control
          </p>
          <h1 class="mb-2 text-4xl font-bold leading-none md:text-6xl">
            S.E.A: Servicio de Emergencia en Ambulancia
          </h1>
          <p class="max-w-xl text-slate-100">
            Priorizacion simple de rutas para ambulancias, hospitales y emergencias.
          </p>
        </div>
        <div
          class="inline-flex min-w-28 items-center gap-3 rounded-lg border border-white/25 bg-white/10 px-4 py-3 text-slate-100"
        >
          <span id="apiStatus" class="h-3 w-3 rounded-full bg-rose-500"></span>
          <span>Backend</span>
        </div>
      </section>

      <section
        class="my-6 grid items-end gap-4 rounded-lg border border-slate-200 bg-white p-5 md:grid-cols-[minmax(180px,1fr)_160px_auto_auto]"
      >
        <label class="grid gap-2 text-sm font-bold text-slate-600">
          Emergencia
          <input
            id="locationInput"
            class="min-h-11 w-full rounded-md border border-slate-300 bg-slate-50 px-3 text-slate-900 outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-100"
            type="text"
            value="Hospital"
          />
        </label>
        <label class="grid gap-2 text-sm font-bold text-slate-600">
          Prioridad
          <select
            id="priorityInput"
            class="min-h-11 w-full rounded-md border border-slate-300 bg-slate-50 px-3 text-slate-900 outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-100"
          >
            <option value="high">Alta</option>
            <option value="medium">Media</option>
            <option value="low">Baja</option>
          </select>
        </label>
        <button
          id="dispatchBtn"
          class="min-h-11 rounded-md bg-teal-700 px-4 font-bold text-white transition hover:bg-teal-800 disabled:cursor-wait disabled:opacity-70"
        >
          Despachar ambulancia
        </button>
        <button
          id="resetBtn"
          class="min-h-11 rounded-md bg-slate-200 px-4 font-bold text-slate-800 transition hover:bg-slate-300 disabled:cursor-wait disabled:opacity-70"
        >
          Reiniciar
        </button>
      </section>

      <section class="grid gap-6 lg:grid-cols-4">
        <article class="min-h-72 rounded-lg border border-slate-200 bg-white p-6">
          <h2 class="mb-5 text-lg font-bold">Ambulancias en emergencia</h2>
          <div id="emergencyAmbulanceList" class="grid gap-3"></div>
        </article>
        <article class="min-h-72 rounded-lg border border-slate-200 bg-white p-6">
          <h2 class="mb-5 text-lg font-bold">Ambulancias disponibles</h2>
          <div id="availableAmbulanceList" class="grid gap-3"></div>
        </article>
        <article class="min-h-72 rounded-lg border border-slate-200 bg-white p-6">
          <h2 class="mb-5 text-lg font-bold">Hospitales</h2>
          <div id="hospitalList" class="grid gap-3"></div>
        </article>
        <article class="min-h-72 rounded-lg border border-slate-200 bg-white p-6">
          <h2 class="mb-5 text-lg font-bold">Ubicacion de emergencia</h2>
          <div id="emergencyLocation" class="grid gap-3"></div>
        </article>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
